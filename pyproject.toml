[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-ingestion-platform"
version = "0.1.0"
description = "TOUMAI media ingestion — YouTube audio + transcript scraper (MVP, ports/adapters)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # [default] tire les extras utiles à certains extracteurs (websockets,
    # pycryptodomex, mutagen...). Les plateformes qui bougent vite (TikTok) exigent
    # une version récente : voir README (nightly + cookies).
    "yt-dlp[default]>=2026.7.4",
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "minio>=7.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "kafka-python-ng>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "mypy>=1.9", "httpx>=0.27"]

[project.scripts]
toumai-ingest = "media_ingestion.cli:main"
toumai-api = "media_ingestion.api.app:main"
toumai-worker = "media_ingestion.worker.consumer:main"
toumai-veille = "media_ingestion.veille.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_ingestion"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
