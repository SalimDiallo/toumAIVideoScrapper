services:
  postgres:
    image: postgres:16
    container_name: toumai-postgres
    environment:
      POSTGRES_USER: toumai
      POSTGRES_PASSWORD: toumai
      POSTGRES_DB: toumai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toumai"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: toumai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: toumai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # crée le bucket au démarrage puis se termine
  createbuckets:
    image: minio/mc
    container_name: toumai-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/toumai-media;
      exit 0;
      "

  # -------------------------------------------------------------------------
  # Airflow (orchestration). Optionnel : démarrer avec `--profile airflow`.
  # UI : http://localhost:8080 (admin / admin). DAG : ingest_video.
  # -------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    container_name: toumai-airflow-postgres
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflowdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.3
    container_name: toumai-airflow-init
    profiles: ["airflow"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/src
      _PIP_ADDITIONAL_REQUIREMENTS: "yt-dlp youtube-transcript-api pydantic pydantic-settings structlog sqlalchemy psycopg[binary] minio kafka-python-ng"
      # les tâches Airflow atteignent les services par leur nom de service
      TOUMAI_STORAGE_BACKEND: minio
      TOUMAI_MINIO_ENDPOINT: minio:9000
      TOUMAI_METADATA_BACKEND: postgres
      TOUMAI_POSTGRES_DSN: postgresql+psycopg://toumai:toumai@postgres:5432/toumai
      TOUMAI_DATA_DIR: /opt/airflow/data
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@toumai.local || true
      "

  airflow-scheduler:
    image: apache/airflow:2.10.3
    container_name: toumai-airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    image: apache/airflow:2.10.3
    container_name: toumai-airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  airflowdata:
